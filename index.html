<style>
:root{
  --bg:#0b0d11;
  --bg-2:#10141c;
  --surface:#141a24;
  --surface-2:#1a2130;
  --ink:#e9edf4;
  --ink-mut:#939cab;
  --ink-faint:#6a7383;
  --line:#242c3c;
  --line-strong:#303b4e;
  --accent:#9d5df6;
  --accent-soft:rgba(157,93,246,.12);
  --glow:rgba(157,93,246,.28);
  --radius:10px;
  --radius-sm:6px;
  --maxw:1180px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Space Grotesk',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5;
  overflow-x:hidden;min-height:100vh;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{
  outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--radius-sm);
}
h1,h2,h3,.display{font-family:'Chakra Petch',system-ui,sans-serif}
::selection{background:var(--accent);color:var(--bg)}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:0;z-index:20;
  background:color-mix(in oklab, var(--bg) 88%, transparent);
  backdrop-filter:none;border-bottom:1px solid var(--line);
}
.top .wrap{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  max-width:var(--maxw);margin:0 auto;padding:14px 22px;
}
.brand{display:inline-flex;align-items:center;gap:.01em;font-family:'Chakra Petch';font-weight:800;letter-spacing:.12em;font-size:1.15rem}
.mark{width:1.2rem;height:1.2rem;color:var(--accent);display:inline-block;flex:0 0 auto}
.links{display:flex;gap:.2rem}
.links a{
  display:inline-flex;align-items:center;justify-content:center;
  padding:.62rem 1rem;font-size:.92rem;font-weight:600;letter-spacing:.04em;
  color:var(--ink-mut);border:1px solid var(--line);border-radius:var(--radius-sm);
  min-height:44px;transition:color .18s,border-color .18s,transform .18s;
}
.links a:hover{color:var(--ink);border-color:var(--accent);transform:translateY(-1px)}

/* ---------- layout ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
section{padding:96px 0;position:relative}
section:first-of-type{padding-top:64px}
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:1rem;margin-bottom:28px;flex-wrap:wrap;
}
.section-head h2{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.section-head h2 .accent{color:var(--accent)}
.section-head a{font-size:.9rem;font-weight:600;color:var(--ink-mut);letter-spacing:.03em;display:inline-flex;align-items:center;gap:.4rem;min-height:44px}
.section-head a:hover{color:var(--accent)}
.section-head a .arr{transition:transform .2s}
.section-head a:hover .arr{transform:translateX(4px)}

/* ---------- hero ---------- */
.hero{padding-top:80px;padding-bottom:20px}
.hero-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,4vw,4rem);
  align-items:center;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:.5rem;
  font-family:'Chakra Petch';font-size:.78rem;font-weight:700;letter-spacing:.18em;
  color:var(--accent);text-transform:uppercase;margin-bottom:1.1rem;
}
.eyebrow::before{content:"";width:1.4rem;height:2px;background:var(--accent)}
.wordmark{
  display:inline-flex;align-items:center;
  font-size:clamp(3rem,10vw,7.4rem);line-height:.88;letter-spacing:.01em;
  font-weight:800;text-transform:uppercase;
}
.wordmark .wl,.wordmark .wr{font-family:inherit;font-weight:inherit;letter-spacing:inherit;text-transform:inherit}
.wordmark .reticle-o{
  display:inline-block;width:1em;height:1em;flex:0 0 auto;color:var(--accent);
  transition:transform .25s cubic-bezier(.22,1,.36,1),filter .25s;
  cursor:default;
}
.wordmark .reticle-o:hover{
  transform:scale(1.35);
  filter:drop-shadow(0 0 8px var(--glow)) drop-shadow(0 0 16px var(--glow));
}
.wordmark .reticle-o svg{transition:transform .35s cubic-bezier(.22,1,.36,1)}
.wordmark .reticle-o:hover svg{transform:rotate(45deg)}

.top .brand .reticle-o{
  color:var(--accent);
  transform:translateY(14%) rotate(0deg);
  transition:transform .25s cubic-bezier(.22,1,.36,1),filter .25s;
}
.top .brand .reticle-o svg{transition:transform .35s cubic-bezier(.22,1,.36,1)}
.top .brand .reticle-o:hover svg{transform:rotate(45deg)}
.tagline{
  margin-top:1.4rem;font-size:clamp(1rem,2vw,1.2rem);
  color:var(--ink-mut);max-width:46ch;line-height:1.55;
}
.cta-row{display:flex;gap:.7rem;margin-top:2rem;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.9rem 1.4rem;font-family:'Chakra Petch';font-weight:700;
  font-size:.92rem;letter-spacing:.05em;text-transform:uppercase;
  border-radius:var(--radius-sm);min-height:48px;
  transition:transform .18s,box-shadow .18s,background .18s,color .18s,border-color .18s;
  cursor:pointer;border:1px solid var(--line);
}
.btn:active{transform:translateY(1px) scale(.995)}
.btn-primary{background:var(--accent);color:#101318;border-color:var(--accent)}
.btn-primary:hover{background:#d8ff45;box-shadow:0 10px 30px -8px var(--glow);transform:translateY(-2px)}
.btn-ghost{color:var(--ink-mut);border-color:var(--line)}
.btn-ghost:hover{color:var(--ink);border-color:var(--accent)}
.hero-meta{
  display:flex;gap:.5rem;flex-wrap:wrap;margin-top:2rem;
  font-family:'Chakra Petch';font-size:.72rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);
}
.hero-meta .dot{display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;animation:blink 2.4s ease-in-out infinite;flex:0 0 auto;margin-right:.4rem;vertical-align:-1px}
.hero-meta span{padding:0 .3rem}
@keyframes blink{50%{opacity:.3}}

/* hero media card */
.hero-media{
  position:relative;
  transition:transform .22s;
}
.video-card{
  position:relative;border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;background:var(--surface);
}
.video-card::before{
  content:"";position:absolute;inset:-3px;border-radius:calc(var(--radius) + 3px);
  background:var(--accent);
  z-index:-1;opacity:0;transition:opacity .3s,transform .45s cubic-bezier(.22,1,.36,1);
  transform:scale(.96);filter:blur(10px);
}
.video-card:hover::before{opacity:1;transform:scale(1)}
.video-card:hover{
  transform:translateY(-3px);
}
.video-card img{
  width:100%;aspect-ratio:16/9;object-fit:cover;display:block;
  transform:scale(1.0);transition:transform .4s cubic-bezier(.22,1,.36,1);
}
.video-card:hover img{
  transform:scale(1.1);
  filter:hue-rotate(10deg) saturate(1.1);
}
.video-card:hover{
  box-shadow:0 0 20px 4px rgba(157,93,246,.4),0 0 40px 10px rgba(157,93,246,.2);
  animation:cardGlow 3s ease-in-out infinite alternate;
}
@keyframes cardGlow{
  0%{box-shadow:0 0 12px 2px rgba(157,93,246,.25),0 0 24px 6px rgba(157,93,246,.1)}
  100%{box-shadow:0 0 20px 4px rgba(157,93,246,.4),0 0 40px 10px rgba(157,93,246,.2)}
}
.video-card .badge{
  position:absolute;top:12px;left:12px;
  font-family:'Chakra Petch';font-size:.7rem;font-weight:800;letter-spacing:.16em;
  color:var(--bg);background:var(--accent);padding:5px 10px;border-radius:var(--radius-sm);
}
.video-card .badge.enemy{background:var(--enemy)}
.card-body{padding:16px 18px 18px}
.card-body h2{font-family:'Chakra Petch';font-size:1.25rem;font-weight:700;letter-spacing:.02em}
.card-body p{color:var(--ink-mut);font-size:.86rem;margin-top:.2rem;font-family:'Chakra Petch';letter-spacing:.04em}
.card-cta{
  position:absolute;inset:0;display:grid;place-items:center;
  color:var(--ink);opacity:0;transition:opacity .25s;cursor:pointer;border-radius:var(--radius);
}
.video-card:hover .card-cta,.video-card:focus-within .card-cta{opacity:1}
.card-cta span{
  font-family:'Chakra Petch';font-weight:700;font-size:.8rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--bg);
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.6rem 1rem;border:none;border-radius:var(--radius-sm);
  transition:background .18s;
  background:var(--accent);
}
.card-cta span:hover{background:var(--accent-soft)}
.aim{
  position:absolute;top:50%;left:50%;width:74px;height:74px;
  translate:-50% -50%;opacity:0;transform:scale(.6) rotate(0deg);
  transition:opacity .28s,transform .38s;pointer-events:none;color:var(--accent);
}
.video-card:hover .aim{opacity:.95;transform:scale(1) rotate(90deg)}

/* ---------- rails ---------- */
.rail{display:grid;gap:14px}
.rail-videos{grid-template-columns:repeat(auto-fill,minmax(238px,1fr))}
.rail .card{
  position:relative;border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;background:var(--surface);
  transition:transform .22s,border-color .22s,box-shadow .22s;
}
.rail .card::before{
  content:"";position:absolute;inset:-3px;border-radius:calc(var(--radius) + 3px);
  background:var(--accent);
  z-index:-1;opacity:0;transition:opacity .3s,transform .45s cubic-bezier(.22,1,.36,1);
  transform:scale(.96);filter:blur(10px);
}
.rail .card:hover::before{opacity:1;transform:scale(1)}
.rail .card:hover{transform:scale(1.08) translateY(-3px) hue-rotate(10deg) saturate(1.1);border-color:var(--accent);box-shadow:0 0 22px 6px rgba(157,93,246,.5),0 0 44px 12px rgba(157,93,246,.2)}
.rail-videos .card{cursor:pointer}
.rail .card img{width:100%;aspect-ratio:16/9;object-fit:cover;transition:transform .45s}
.rail-videos .card:hover img{transform:scale(1.08);filter:hue-rotate(10deg) saturate(1.1)}
.rail-videos .card .num{
  position:absolute;top:10px;left:10px;
  font-family:'Chakra Petch';font-weight:800;font-size:.7rem;letter-spacing:.14em;
  color:var(--bg);background:var(--accent);padding:3px 8px;border-radius:4px;
}
.rail-videos .card figcaption{padding:13px 15px 15px;transition:transform .45s cubic-bezier(.22,1,.36,1)}
.rail-videos .card:hover figcaption{transform:scale(1.08)}
.rail-videos .card figcaption h3{font-size:.98rem;font-weight:700;letter-spacing:.02em;line-height:1.25}
.rail-videos .card figcaption p{color:var(--ink-mut);font-size:.78rem;margin-top:.25rem;font-family:'Chakra Petch';letter-spacing:.03em}


/* ---------- about ---------- */
.about{padding-top:80px;padding-bottom:90px}
.about-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(2rem,5vw,5rem);align-items:start}
.about h2{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:800;letter-spacing:.02em;text-transform:uppercase;margin-bottom:1.1rem}
.about h2 .accent{color:var(--accent)}
.about p{color:var(--ink-mut);font-size:1.02rem;max-width:52ch;line-height:1.7}
.about p b{color:var(--ink);font-weight:700}
.about .side{
  border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;background:var(--surface);
}
.about .side .row{
  display:flex;justify-content:space-between;gap:1rem;
  padding:.95rem 0;border-bottom:1px solid var(--line);
  font-family:'Chakra Petch';font-size:.86rem;letter-spacing:.03em;
}
.about .side .row:last-child{border-bottom:none}
.about .side .row .k{color:var(--ink-faint);text-transform:uppercase;letter-spacing:.12em;font-size:.7rem}
.about .side .row .v{color:var(--ink);font-weight:600;text-align:right}
.about .side .v .accent{color:var(--accent)}

/* ---------- connect ---------- */
.connect{padding-top:40px;padding-bottom:60px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.connect h2{font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:26px}
.connect-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.connect .soc{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
  background:var(--surface);cursor:pointer;
  transition:transform .18s,border-color .18s,background .18s;min-height:84px;
}
.connect .soc:hover{border-color:var(--accent);transform:translateY(-3px);background:var(--surface-2)}
.connect .soc .s-label{font-family:'Chakra Petch';font-weight:700;font-size:1rem;letter-spacing:.04em}
.connect .soc .s-sub{font-size:.78rem;color:var(--ink-mut);font-family:'Chakra Petch';letter-spacing:.04em;margin-top:2px}
.connect .soc .arr{color:var(--ink-faint);transition:transform .2s}
.connect .soc:hover .arr{transform:translateX(4px);color:var(--accent)}

/* ---------- footer ---------- */
footer{padding:30px 0}
.foot{
  display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  max-width:var(--maxw);margin:0 auto;padding:0 22px;
  font-family:'Chakra Petch';font-size:.74rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint);
}
.foot .b{color:var(--ink-mut);font-weight:600}
.foot a{color:var(--ink-mut)}
.foot a:hover{color:var(--accent)}
.foot .rowlinks{display:flex;gap:1rem}
.foot .rowlinks a{color:var(--ink-faint)}

/* ---------- reveals ---------- */
.rv{opacity:0;translate:0 16px;transition:opacity .7s cubic-bezier(.16,.8,.3,1),translate .7s cubic-bezier(.16,.8,.3,1)}
.rv.in{opacity:1;translate:0 0}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .rv{opacity:1;translate:0 0}
  .hero-meta .dot{animation:none}
}

/* ---------- rank plate ---------- */
.rank-plate{display:inline-flex;align-items:center;gap:.45rem;
  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);
  padding:.35rem .65rem;margin-top:.7rem;
  font-family:'Chakra Petch';font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mut)}
.rank-plate .rk{color:var(--accent)}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr;gap:2rem}
  .hero-media{max-width:560px}
  .about-grid{grid-template-columns:1fr;gap:1.6rem}
  .connect-grid{grid-template-columns:1fr}
  section{padding:64px 0}
}
@media (max-width:600px){
  .top .wrap{padding:12px 16px}
  .links a{padding:.55rem .75rem;font-size:.84rem}
  .wrap{padding:0 16px}
  footer .rowlinks{display:none}
}
</style>
</head>
